<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5f5f2" />
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#82828f" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#0a0a0c" />

  <g font-size="15">
    <!-- Row 1: sources -->
    <rect x="380" y="40" width="200" height="50" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="480" y="70" text-anchor="middle" fill="#f5f5f2" font-weight="600">train.csv</text>

    <rect x="620" y="40" width="200" height="50" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="720" y="70" text-anchor="middle" fill="#f5f5f2" font-weight="600">store.csv</text>

    <!-- Row 2: preprocessing -->
    <rect x="440" y="120" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="143" text-anchor="middle" fill="#f5f5f2" font-weight="600">preprocessing</text>
    <text x="600" y="162" text-anchor="middle" fill="#82828f" font-size="12">01_preprocessing.Rmd</text>

    <!-- Row 3: feature dataset -->
    <rect x="440" y="206" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="229" text-anchor="middle" fill="#f5f5f2" font-weight="600">feature dataset</text>
    <text x="600" y="248" text-anchor="middle" fill="#82828f" font-size="12">28 features · calendar + promo + history</text>

    <!-- EDA branch -->
    <rect x="60" y="292" width="260" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="190" y="315" text-anchor="middle" fill="#f5f5f2" font-weight="600">eda</text>
    <text x="190" y="334" text-anchor="middle" fill="#82828f" font-size="12">02_EDA.Rmd · exploratory only</text>

    <!-- Row 4: tune -->
    <rect x="440" y="292" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="315" text-anchor="middle" fill="#f5f5f2" font-weight="600">tune</text>
    <text x="600" y="334" text-anchor="middle" fill="#82828f" font-size="12">04_tune_xgboost_model.R → best params</text>

    <!-- Row 5: train -->
    <rect x="440" y="378" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="401" text-anchor="middle" fill="#f5f5f2" font-weight="600">train</text>
    <text x="600" y="420" text-anchor="middle" fill="#82828f" font-size="12">03_train_global_model.R → xgb model</text>

    <!-- Evaluate branch -->
    <rect x="880" y="464" width="260" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="1010" y="487" text-anchor="middle" fill="#f5f5f2" font-weight="600">evaluate</text>
    <text x="1010" y="506" text-anchor="middle" fill="#82828f" font-size="12">05 · rmse/mae · feature importance</text>

    <!-- Shiny app (terminal) -->
    <rect x="440" y="464" width="320" height="60" fill="#16161c" stroke="#e5484d" />
    <text x="600" y="489" text-anchor="middle" fill="#f5f5f2" font-weight="700">shiny app</text>
    <text x="600" y="510" text-anchor="middle" fill="#e5484d" font-size="12">store 1–1115 · 7–90 day window</text>
  </g>

  <!-- source merge -->
  <path d="M480,90 C 500,105 540,112 590,119" fill="none" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M720,90 C 700,105 660,112 610,119" fill="none" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- straight main-lane arrows -->
  <line x1="600" y1="176" x2="600" y2="204" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="348" x2="600" y2="376" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="434" x2="600" y2="462" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- feature dataset -> tune -->
  <line x1="600" y1="262" x2="600" y2="290" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- feature dataset -> EDA (dashed, muted) -->
  <path d="M480,262 C 380,278 280,290 200,290" fill="none" stroke="#82828f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-mute)" />
  <text x="330" y="278" fill="#82828f" font-size="11">exploratory only</text>

  <!-- train -> evaluate (dashed, muted) -->
  <path d="M720,434 C 850,448 940,455 1000,462" fill="none" stroke="#82828f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-mute)" />
  <text x="800" y="450" fill="#82828f" font-size="11">diagnostics</text>

  <!-- feature dataset -> shiny app (dashed, muted, long curve) -->
  <path d="M762,230 C 900,260 900,420 730,464" fill="none" stroke="#82828f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-mute)" />
  <text x="838" y="330" fill="#82828f" font-size="11" transform="rotate(78 838 330)">loads preprocessed data</text>

  <!-- footer -->
  <text x="60" y="600" fill="#82828f" font-size="13">chronological train/test split — last 6 weeks held out, no random shuffling</text>
  <text x="60" y="622" fill="#82828f" font-size="13">final: rmse 663.47 · mae 438.57 — down ~54% / ~59% from baseline</text>
</svg>
