<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5f5f2" />
    </marker>
    <marker id="arrow-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#82828f" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#0a0a0c" />

  <g font-size="15">
    <!-- A: Kaggle dataset -->
    <rect x="440" y="40" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="63" text-anchor="middle" fill="#f5f5f2" font-weight="600">kaggle dataset</text>
    <text x="600" y="82" text-anchor="middle" fill="#82828f" font-size="12">72,134 labeled articles</text>

    <!-- B: download -->
    <rect x="440" y="126" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="149" text-anchor="middle" fill="#f5f5f2" font-weight="600">download_data.py</text>
    <text x="600" y="168" text-anchor="middle" fill="#82828f" font-size="12">→ raw csv</text>

    <!-- C: preprocessing -->
    <rect x="440" y="212" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="235" text-anchor="middle" fill="#f5f5f2" font-weight="600">preprocessing</text>
    <text x="600" y="254" text-anchor="middle" fill="#82828f" font-size="12">clean_text + vader sentiment</text>

    <!-- D: feature matrix -->
    <rect x="440" y="298" width="320" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="600" y="321" text-anchor="middle" fill="#f5f5f2" font-weight="600">feature matrix</text>
    <text x="600" y="340" text-anchor="middle" fill="#82828f" font-size="12">tf-idf (5000) + sentiment → hstack</text>

    <!-- E-left: logistic regression -->
    <rect x="320" y="384" width="260" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="450" y="407" text-anchor="middle" fill="#f5f5f2" font-weight="600">logistic regression</text>
    <text x="450" y="426" text-anchor="middle" fill="#82828f" font-size="12">linear signal</text>

    <!-- E-right: random forest -->
    <rect x="620" y="384" width="260" height="56" fill="#101014" stroke="rgba(245,245,242,0.18)" />
    <text x="750" y="407" text-anchor="middle" fill="#f5f5f2" font-weight="600">random forest</text>
    <text x="750" y="426" text-anchor="middle" fill="#82828f" font-size="12">non-linear signal</text>

    <!-- F: meta-classifier -->
    <rect x="440" y="470" width="320" height="56" fill="#101014" stroke="rgba(229,72,77,0.4)" />
    <text x="600" y="493" text-anchor="middle" fill="#f5f5f2" font-weight="600">meta-classifier</text>
    <text x="600" y="512" text-anchor="middle" fill="#82828f" font-size="12">logistic regression · gridsearchcv</text>

    <!-- G: Streamlit app (terminal) -->
    <rect x="440" y="556" width="320" height="60" fill="#16161c" stroke="#e5484d" />
    <text x="600" y="581" text-anchor="middle" fill="#f5f5f2" font-weight="700">streamlit app</text>
    <text x="600" y="602" text-anchor="middle" fill="#e5484d" font-size="12">predict · preprocess pages</text>
  </g>

  <!-- straight arrows -->
  <line x1="600" y1="96" x2="600" y2="124" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="182" x2="600" y2="210" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="268" x2="600" y2="296" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="526" x2="600" y2="554" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- split: feature matrix -> LR / RF -->
  <path d="M540,354 C 480,368 460,372 450,382" fill="none" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M660,354 C 720,368 740,372 750,382" fill="none" stroke="#f5f5f2" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- converge: LR / RF -> meta-classifier -->
  <path d="M470,440 C 500,452 540,458 580,468" fill="none" stroke="#82828f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-mute)" />
  <path d="M730,440 C 700,452 660,458 620,468" fill="none" stroke="#82828f" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-mute)" />
  <text x="600" y="452" text-anchor="middle" fill="#82828f" font-size="11">predicted probabilities</text>

  <!-- footer -->
  <text x="440" y="648" fill="#82828f" font-size="13">held-out test split: 20% · saved with joblib for the streamlit app</text>
  <text x="440" y="666" fill="#82828f" font-size="13">meta-classifier: 95.51% accuracy, beats both base models on every metric</text>
</svg>
